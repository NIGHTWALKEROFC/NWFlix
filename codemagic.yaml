# NWMovie - Codemagic build file. Codemagic picks up every push to "main" automatically.
#
# 1) KEYSTORE: replace  nwmovie_keystore  (4 places) with the reference name of the keystore
#    you already uploaded in Codemagic (Teams > Code signing identities > Android keystores).
# 2) Optional keys: TG_API_ID, TG_API_HASH, TMDB_API_KEY. If you do not set them anywhere the app asks for them on first start.
#    To bake them into the build: create a variable group in Codemagic (e.g. "nwmovie_secrets") with those three
#    variables, then remove the "#" in front of the "groups:" lines.
# 3) Needs gradlew and gradle/wrapper/gradle-wrapper.jar in the repository (see README).
#
# Only "android-universal" starts automatically on a push (it builds every CPU type + one universal APK).
# The single-CPU workflows are started by hand with "Start new build" to save build minutes.

workflows:

  android-universal:
    name: NWMovie - all CPU types + universal APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - nwmovie_keystore
      # groups:
      #   - nwmovie_secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build release APKs
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=universal
    artifacts:
      - app/build/outputs/apk/release/*.apk

  android-arm64-v8a:
    name: NWMovie - arm64-v8a (most phones since 2017)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      android_signing:
        - nwmovie_keystore
      # groups:
      #   - nwmovie_secrets
    scripts:
      - name: Build release APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=arm64-v8a
    artifacts:
      - app/build/outputs/apk/release/*.apk

  android-armeabi-v7a:
    name: NWMovie - armeabi-v7a (older 32-bit phones)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      android_signing:
        - nwmovie_keystore
      # groups:
      #   - nwmovie_secrets
    scripts:
      - name: Build release APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=armeabi-v7a
    artifacts:
      - app/build/outputs/apk/release/*.apk

  android-x86_64:
    name: NWMovie - x86_64 (emulators, Chromebooks)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      android_signing:
        - nwmovie_keystore
      # groups:
      #   - nwmovie_secrets
    scripts:
      - name: Build release APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=x86_64
    artifacts:
      - app/build/outputs/apk/release/*.apk
