# NWMovie - Codemagic build file (same style as your NWisp Chat setup).
#
# HOW THE KEYS REACH THE APP (same idea as NWisp):
#   Codemagic stores the values -> they become environment variables during the build ->
#   app/build.gradle.kts reads them and compiles them into the app. Nothing is typed inside the app
#   and nothing secret sits in GitHub.
#   NWisp does the same with "--dart-define=..."; this native Android app does it with BuildConfig.
#
# ONE-TIME SETUP IN CODEMAGIC (before the first build):
#   Codemagic -> Teams -> your team -> Global variables and secrets -> Add group
#   Group name: nwmovie_secrets   with these 3 variables (tick "Secure"):
#       TG_API_ID      your Telegram api_id (numbers only)
#       TG_API_HASH    your Telegram api_hash
#       TMDB_API_KEY   your TMDB v3 API key
#   The "groups:" line below connects the group to this workflow.
#
# Signing uses the keystore already uploaded in Codemagic (reference name: nightwalker_keystore).
# No "instance_type" on purpose (free plan = default machine).
# One workflow builds every CPU type: arm64-v8a, armeabi-v7a, x86_64 + one universal APK.
# Start it with "Start new build" - Codemagic always fetches the newest code from GitHub.

workflows:
  nwmovie-android:
    name: NWMovie - Android (all CPU types + universal)
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      android_signing:
        - nightwalker_keystore
    scripts:
      - name: Build release APKs
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TMDB_API_KEY" ]; then
            echo "ERROR: TG_API_ID, TG_API_HASH and TMDB_API_KEY must be set in the Codemagic variable group nwmovie_secrets."
            exit 1
          fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x ./gradlew
            GRADLE=./gradlew
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE=/tmp/gradle-8.10.2/bin/gradle
          fi
          $GRADLE --no-daemon assembleRelease -Pabi=universal
    artifacts:
      - app/build/outputs/apk/release/*.apk
