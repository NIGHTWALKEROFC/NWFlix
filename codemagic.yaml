# Codemagic build file for NWMovie.
# One workflow per CPU type. Pick the one that matches the phone (see README "Which build do I install?").
# Secrets (TG_API_ID, TG_API_HASH, TMDB_API_KEY) are OPTIONAL here: create a variable group called
# "nwmovie_secrets" in Codemagic (Teams → Global variables and secrets) – or delete the "groups" lines
# and type the keys inside the app on first launch instead.
#
# Builds are started manually ("Start new build"). To build on every push, add under a workflow:
#   triggering:
#     events: [push]
#     branch_patterns:
#       - pattern: main
#         include: true

workflows:

  android-arm64-v8a:
    name: NWMovie - arm64-v8a (most phones since 2017)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      vars:
        ABI: arm64-v8a
        GRADLE_TASK: assembleRelease
      # For a stable signing key (needed for Play Store / updates over older installs) add:
      # android_signing:
      #   - nwmovie_keystore
    scripts:
      - name: Build APK
        script: bash scripts/build_android.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

  android-armeabi-v7a:
    name: NWMovie - armeabi-v7a (older 32-bit phones)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      vars:
        ABI: armeabi-v7a
        GRADLE_TASK: assembleRelease
    scripts:
      - name: Build APK
        script: bash scripts/build_android.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

  android-x86_64:
    name: NWMovie - x86_64 (emulators, Chromebooks)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      vars:
        ABI: x86_64
        GRADLE_TASK: assembleRelease
    scripts:
      - name: Build APK
        script: bash scripts/build_android.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

  android-universal:
    name: NWMovie - all CPU types + one universal APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      vars:
        ABI: universal
        GRADLE_TASK: assembleRelease
    scripts:
      - name: Build APKs
        script: bash scripts/build_android.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt

  android-app-bundle:
    name: NWMovie - Android App Bundle (.aab for Play Store)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      vars:
        GRADLE_TASK: bundleRelease
      # A bundle for the Play Store must be signed with your own key:
      # android_signing:
      #   - nwmovie_keystore
    scripts:
      - name: Build AAB
        script: bash scripts/build_android.sh
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
