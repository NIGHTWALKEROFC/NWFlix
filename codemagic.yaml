workflows:
  nwmovie-android:
    name: NWFlix Android
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - nwmovie_secrets
      android_signing:
        - nightwalker_keystore
    scripts:
      - name: Build release APKs
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TMDB_API_KEY" ]; then
            echo "TG_API_ID, TG_API_HASH and TMDB_API_KEY are missing in group nwmovie_secrets"
            exit 1
          fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x ./gradlew
            GRADLE=./gradlew
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE=/tmp/gradle-8.10.2/bin/gradle
          fi
          $GRADLE --no-daemon assembleRelease -Pabi=universal
    artifacts:
      - app/build/outputs/apk/release/*.apk
