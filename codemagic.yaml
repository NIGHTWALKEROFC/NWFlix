# NWMovie - Codemagic build file (same style as your NWisp Chat setup).
#
# * No "instance_type" line on purpose: your free Codemagic plan only allows the default machine
#   (asking for linux_x2 gives "instance type is not available with the current billing plan").
# * Signing uses the keystore you already uploaded in Codemagic (reference name: nightwalker_keystore).
#   If you want a different keystore for this app, change that one name below.
# * One workflow builds every CPU type in a single run: arm64-v8a, armeabi-v7a, x86_64
#   plus one universal APK (all files appear under "Artifacts").
# * Start it with "Start new build" in Codemagic - it always fetches the newest code from GitHub.
#   (To build automatically on every push, add under the workflow:
#      triggering:
#        events: [push]
#        branch_patterns:
#          - pattern: main
#            include: true )
#
# OPTIONAL build-time keys (Telegram api_id / api_hash, TMDB key):
#   You do not need them here. If they are not set, NWMovie asks for them on its first screen and keeps
#   them encrypted on the phone, so nothing secret ever sits in the repository.
#   (Codemagic can't read GitHub Secrets. To bake keys into the APK, remove the "#" below and use
#   your real values only if the repository is PRIVATE, or add them in Codemagic > app > Environment variables.)
#
#      vars:
#        TG_API_ID: "1234567"
#        TG_API_HASH: "your_api_hash"
#        TMDB_API_KEY: "your_tmdb_v3_key"

workflows:
  nwmovie-android:
    name: NWMovie - Android (all CPU types + universal)
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - nightwalker_keystore
    scripts:
      - name: Build release APKs
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradlew ]; then
            chmod +x ./gradlew
            GRADLE=./gradlew
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE=/tmp/gradle-8.10.2/bin/gradle
          fi
          $GRADLE --no-daemon assembleRelease -Pabi=universal
    artifacts:
      - app/build/outputs/apk/release/*.apk
